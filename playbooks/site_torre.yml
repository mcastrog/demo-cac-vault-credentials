---
- name: "CaC - Aplicar configuración de {{ torre }}"
  hosts: localhost
  connection: local
  gather_facts: false

  vars_files:
    - "../{{ torre }}/secrets.yml"
    - "../{{ torre }}/credentials.yml"
    - "../{{ torre }}/projects.yml"
    - "../{{ torre }}/inventories.yml"
    - "../{{ torre }}/job_templates.yml"

  vars:
    aap_hostname: "{{ lookup('ansible.builtin.env', 'CAC_AAP_HOST') }}"
    aap_username: "{{ lookup('ansible.builtin.env', 'CAC_AAP_USERNAME') }}"
    aap_password: "{{ lookup('ansible.builtin.env', 'CAC_AAP_PASSWORD') }}"
    aap_validate_certs: false

  roles:
    - role: infra.aap_configuration.dispatch
